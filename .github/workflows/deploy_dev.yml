name: Deploy to EC2 (Direct SSH)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # EC2에 접속해서 실행할 명령어들
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            sudo rm -f /home/${{ secrets.EC2_USER }}/backend/.git/index.lock
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /home/${{ secrets.EC2_USER }}/backend
            git config --global --add safe.directory /home/${{ secrets.EC2_USER }}/backend
            cd backend
            git checkout prod
            git pull
            pnpm install
            pm2 reload all